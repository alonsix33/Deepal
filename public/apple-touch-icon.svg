<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1976D2"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- iOS clips to its own rounded rect shape; rx here is just a visual fallback -->
  <rect width="180" height="180" rx="40" fill="url(#bg)"/>
  <!-- Bolt scaled to 180px, same proportions as main icon -->
  <path d="M108 30 L65 98 H89 L59 150 L118 82 H94 Z" fill="white" opacity="0.97" filter="url(#glow)"/>
</svg>
