<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A"/>
      <stop offset="100%" style="stop-color:#1A1A1A"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#0095FF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Car body outline -->
  <path d="M100 320 L130 260 L180 220 L332 220 L382 260 L412 320 L412 360 L100 360 Z"
        fill="none"
        stroke="url(#glow)"
        stroke-width="8"
        stroke-linejoin="round"/>

  <!-- Car roof -->
  <path d="M180 220 L200 180 L312 180 L332 220"
        fill="none"
        stroke="url(#glow)"
        stroke-width="8"
        stroke-linejoin="round"/>

  <!-- Front headlight -->
  <circle cx="140" cy="300" r="12" fill="#00D4FF"/>

  <!-- Rear light -->
  <circle cx="372" cy="300" r="12" fill="#00D4FF"/>

  <!-- Lightning bolt (EV symbol) -->
  <path d="M256 120 L230 200 L260 200 L240 280 L290 180 L260 180 L280 120 Z"
        fill="#00D4FF"/>

  <!-- Wheels -->
  <circle cx="170" cy="360" r="35" fill="none" stroke="#00D4FF" stroke-width="6"/>
  <circle cx="170" cy="360" r="18" fill="#00D4FF" opacity="0.5"/>
  <circle cx="342" cy="360" r="35" fill="none" stroke="#00D4FF" stroke-width="6"/>
  <circle cx="342" cy="360" r="18" fill="#00D4FF" opacity="0.5"/>

  <!-- Text -->
  <text x="256" y="450"
        font-family="Arial, sans-serif"
        font-size="48"
        font-weight="bold"
        fill="#FFFFFF"
        text-anchor="middle">S05</text>
</svg>
